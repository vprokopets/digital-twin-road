[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-road"
version = "2.0.0"
description = "Cyber-Physical Highway Infrastructure Digital Twin & Digital Shadow Platform"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Volodymyr Prokopets" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "geopy>=2.4.0",
    "statsmodels>=0.14.0",
    "scipy>=1.12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8.4"]
docs = ["zensical>=0.0.70", "pymdown-extensions>=10.0"]

[tool.setuptools]
py-modules = ["dashboard_backend", "digital_shadow", "fm", "hpn"]

[tool.setuptools.packages.find]
include = ["api*", "world*", "vehicle*", "data_curation*", "SimPLs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 129
target-version = "py311"
extend-exclude = [".venv", "venv", "frontend", "chair_assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
