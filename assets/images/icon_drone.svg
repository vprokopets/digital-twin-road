<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 4 Diagonal Carbon Fiber Rotor Arms -->
  <line x1="50" y1="50" x2="22" y2="22" stroke="#001f3f" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="50" x2="78" y2="22" stroke="#001f3f" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="50" x2="22" y2="78" stroke="#001f3f" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="50" x2="78" y2="78" stroke="#001f3f" stroke-width="6" stroke-linecap="round" />

  <!-- Inner Arm Accents (Visible Dark Blue with White Piping) -->
  <line x1="50" y1="50" x2="22" y2="22" stroke="#00305E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="78" y2="22" stroke="#00305E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="22" y2="78" stroke="#00305E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="78" y2="78" stroke="#00305E" stroke-width="3.5" stroke-linecap="round" />

  <!-- 4 Rotor Discs / Propeller Spin Rings (Visible Dark Blue with Crisp White Borders) -->
  <!-- Top-Left Rotor (Front-Left) -->
  <circle cx="22" cy="22" r="16" fill="#00305E" fill-opacity="0.22" stroke="#00305E" stroke-width="2.5" />
  <circle cx="22" cy="22" r="16" stroke="#ffffff" stroke-width="1" stroke-dasharray="12 4" />
  <ellipse cx="22" cy="22" rx="14" ry="4" transform="rotate(35 22 22)" fill="#002040" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="22" cy="22" r="4.5" fill="#001f3f" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="22" cy="22" r="1.8" fill="#ef4444" /> <!-- Port Red Nav Light -->

  <!-- Top-Right Rotor (Front-Right) -->
  <circle cx="78" cy="22" r="16" fill="#00305E" fill-opacity="0.22" stroke="#00305E" stroke-width="2.5" />
  <circle cx="78" cy="22" r="16" stroke="#ffffff" stroke-width="1" stroke-dasharray="12 4" />
  <ellipse cx="78" cy="22" rx="14" ry="4" transform="rotate(-35 78 22)" fill="#002040" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="78" cy="22" r="4.5" fill="#001f3f" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="78" cy="22" r="1.8" fill="#00AA82" /> <!-- Starboard Green Nav Light -->

  <!-- Bottom-Left Rotor (Rear-Left) -->
  <circle cx="22" cy="78" r="16" fill="#00305E" fill-opacity="0.22" stroke="#00305E" stroke-width="2.5" />
  <circle cx="22" cy="78" r="16" stroke="#ffffff" stroke-width="1" stroke-dasharray="12 4" />
  <ellipse cx="22" cy="78" rx="14" ry="4" transform="rotate(-35 22 78)" fill="#002040" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="22" cy="78" r="4.5" fill="#001f3f" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="22" cy="78" r="1.8" fill="#ffffff" />

  <!-- Bottom-Right Rotor (Rear-Right) -->
  <circle cx="78" cy="78" r="16" fill="#00305E" fill-opacity="0.22" stroke="#00305E" stroke-width="2.5" />
  <circle cx="78" cy="78" r="16" stroke="#ffffff" stroke-width="1" stroke-dasharray="12 4" />
  <ellipse cx="78" cy="78" rx="14" ry="4" transform="rotate(35 78 78)" fill="#002040" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="78" cy="78" r="4.5" fill="#001f3f" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="78" cy="78" r="1.8" fill="#ffffff" />

  <!-- Central Avionics Fuselage (Main Body) -->
  <!-- Aerodynamic Pod Body in Deep Dark Blue with White Outline -->
  <rect x="36" y="32" width="28" height="36" rx="9" fill="#00305E" stroke="#ffffff" stroke-width="2.2" />
  <rect x="39" y="35" width="22" height="30" rx="6" fill="#002244" stroke="#5096BE" stroke-width="1" />

  <!-- Top GNSS / RTK Satellite Positioning Dome -->
  <circle cx="50" cy="44" r="6" fill="#004480" stroke="#ffffff" stroke-width="1" />
  <circle cx="50" cy="44" r="3" fill="#5096BE" />
  <circle cx="50" cy="44" r="1.2" fill="#BECD32" />

  <!-- Zenmuse P1 / L1 LiDAR & Optical Photogrammetry Gimbal Pod -->
  <rect x="44" y="56" width="12" height="10" rx="3" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
  <!-- Optical Camera Lens Aperture with Anti-Reflective Coating Glow -->
  <circle cx="50" cy="61" r="3.5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" />
  <circle cx="50" cy="61" r="1.5" fill="#00AA82" /> <!-- Sensor Active Eye -->

  <!-- Forward Orientation Arrow (Heading) -->
  <polygon points="50,27 45,34 55,34" fill="#BECD32" stroke="#00305E" stroke-width="0.8" />
</svg>