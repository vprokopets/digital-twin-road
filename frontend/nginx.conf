server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high-throughput map tiles and GeoJSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse-proxy REST API & SSE stream to FastAPI backend container
    location /dashboard/ {
        proxy_pass http://demo-backend:8000/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Reverse-proxy /api/ endpoints (asset updates, scenarios)
    location /api/ {
        proxy_pass http://demo-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vue Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
